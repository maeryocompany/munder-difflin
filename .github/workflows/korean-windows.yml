name: Korean Windows build

# Builds the Korean (ko) Windows installer and publishes it to a GitHub
# Release on this fork, so it can be downloaded and installed directly.
# Runs on every push to korean-locale, or manually from the Actions tab.
on:
  push:
    branches: [korean-locale]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korean-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (native node-pty rebuild) needs distutils, gone in Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Compile (electron-vite -> out/)
        run: npm run build

      # Point the auto-updater at this fork, so it never swaps the Korean
      # build for an English upstream release.
      - name: Package installer
        run: >
          npx electron-builder --win nsis --x64 --publish never
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="ko-v${version}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Munder Difflin 한글판 ${version} (빌드 ${GITHUB_RUN_NUMBER})" \
            --notes "한국어 Windows 설치 파일입니다. 아래 Assets에서 *-setup.exe 를 내려받아 실행하세요. 설치 후 Settings → General → Language 에서 '한국어'를 고르세요."
